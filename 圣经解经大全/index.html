<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圣经解经大全</title>
    <style>
        :root {
            --bg: #f8f8f9;
            --surface: #ffffff;
            --surface-2: #f1f2f4;
            --ink: #21252b;
            --ink-2: #4a4f57;
            --muted: #7a8089;
            --line: #e4e6ea;
            --accent: #6d28d9;
            --accent-strong: #5b21b6;
            --accent-soft: #f4f1fd;
            --shadow-1: 0 1px 2px rgba(17, 24, 39, .05);
            --shadow-2: 0 6px 20px -6px rgba(17, 24, 39, .12);
            --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #131316;
                --surface: #1b1b1f;
                --surface-2: #242429;
                --ink: #e9e9ec;
                --ink-2: #b6b8bd;
                --muted: #8b8e95;
                --line: #2e2f35;
                --accent: #a78bfa;
                --accent-strong: #c4b5fd;
                --accent-soft: #2c2545;
                --shadow-1: 0 1px 2px rgba(0, 0, 0, .3);
                --shadow-2: 0 6px 20px -6px rgba(0, 0, 0, .5);
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.8;
            color: var(--ink);
            background: var(--bg);
            min-height: 100vh;
        }
        ::selection { background: var(--accent-soft); color: var(--accent-strong); }
        .container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 24px 20px 40px;
        }
        .back-link {
            display: inline-block;
            color: var(--ink-2);
            text-decoration: none;
            padding: 7px 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: .9em;
            transition: border-color .15s, color .15s;
        }
        .back-link:hover {
            border-color: var(--accent);
            color: var(--accent-strong);
        }
        .header {
            text-align: center;
            padding: 52px 20px 34px;
        }
        .header h1 {
            font-size: 2.3em;
            font-weight: 700;
            letter-spacing: .02em;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.05em;
            color: var(--muted);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin: 10px 0 30px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px 12px;
            text-align: center;
            box-shadow: var(--shadow-1);
        }
        .stat-number {
            font-size: 1.9em;
            font-weight: 700;
            color: var(--accent-strong);
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
        }
        .stat-label {
            font-size: .88em;
            color: var(--muted);
            margin-top: 4px;
        }
        .section {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 26px 26px 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-1);
        }
        .section h2 {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--ink);
            padding-left: 12px;
            border-left: 4px solid var(--accent);
            margin-bottom: 18px;
        }
        .cat-label {
            font-size: .85em;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: .1em;
            margin: 18px 0 10px;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 12px;
        }
        .book-card {
            background: var(--surface-2);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 14px 16px;
            text-decoration: none;
            color: var(--ink);
            transition: transform .15s, box-shadow .15s, border-color .15s, background .15s;
            display: block;
        }
        .book-card:hover {
            transform: translateY(-2px);
            background: var(--surface);
            border-color: var(--accent);
            box-shadow: var(--shadow-2);
        }
        .book-card h3 {
            font-size: 1.02em;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 4px;
        }
        .book-card .info {
            font-size: .8em;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .book-card .badge {
            display: inline-block;
            background: var(--accent-soft);
            color: var(--accent-strong);
            padding: 1px 9px;
            border-radius: 999px;
            font-size: .74em;
            margin-top: 8px;
        }
        footer {
            text-align: center;
            padding: 30px 10px 10px;
            color: var(--muted);
            font-size: .9em;
        }
        footer p { text-align: center; }
        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 1.7em; }
            .header { padding: 34px 10px 24px; }
            .section { padding: 20px 16px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← 返回主页</a>
        <div class="header">
            <h1>圣经解经大全</h1>
            <p>逐句解经 · 希伯来文/希腊文原词 · 旧约背景 · 新约联系</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="stat-books">66</div>
                <div class="stat-label">书卷</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-sections">—</div>
                <div class="stat-label">解经单元</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-chapters">—</div>
                <div class="stat-label">章节</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-verses">—</div>
                <div class="stat-label">经节</div>
            </div>
        </div>

        <div class="section">
            <h2>📜 旧约</h2>
            <div id="old-testament" class="book-grid-wrap"></div>
        </div>

        <div class="section">
            <h2>✝️ 新约</h2>
            <div id="new-testament" class="book-grid-wrap"></div>
        </div>

        <footer>
            <p>圣经解经大全 · 愿荣耀归于神</p>
            <p style="margin-top: 8px; font-size: .9em;">逐句解经 · 希伯来文/希腊文原词 · 旧约背景 · 新约联系</p>
        </footer>
    </div>

            // 普通书信

            {name: "彼得前书", chapters: 5, verses: 105, sections: 4, category: "普通书信", testament: "new"},
            {name: "彼得后书", chapters: 3, verses: 61, sections: 3, category: "普通书信", testament: "new"},
            {name: "约翰一书", chapters: 5, verses: 105, sections: 5, category: "普通书信", testament: "new"},
            {name: "约翰二书", chapters: 1, verses: 13, sections: 1, category: "普通书信", testament: "new"},
            {name: "约翰三书", chapters: 1, verses: 15, sections: 1, category: "普通书信", testament: "new"},
            {name: "犹大书", chapters: 1, verses: 25, sections: 1, category: "普通书信", testament: "new"},
            // 启示录
            {name: "启示录", chapters: 22, verses: 404, sections: 20, category: "启示录", testament: "new"}
        ];

        document.addEventListener('DOMContentLoaded', function() {
            renderBooks();
            renderStats();
        });

        function renderStats() {
            const sum = key => books.reduce((a, b) => a + b[key], 0);
            document.getElementById('stat-books').textContent = books.length.toLocaleString();
            document.getElementById('stat-sections').textContent = sum('sections').toLocaleString();
            document.getElementById('stat-chapters').textContent = sum('chapters').toLocaleString();
            document.getElementById('stat-verses').textContent = sum('verses').toLocaleString();
        }

        function renderBooks() {
            const containers = {
                old: document.getElementById('old-testament'),
                new: document.getElementById('new-testament')
            };

            let currentCategory = '';
            books.forEach(book => {
                const host = containers[book.testament];
                if (book.category !== currentCategory) {
                    currentCategory = book.category;
                    const label = document.createElement('div');
                    label.className = 'cat-label';
                    label.textContent = book.category;
                    const grid = document.createElement('div');
                    grid.className = 'book-grid';
                    grid.dataset.category = book.category;
                    host.appendChild(label);
                    host.appendChild(grid);
                }
                const card = document.createElement('a');
                card.className = 'book-card';
                card.href = `${book.name}解经大全/index.html`;
                card.innerHTML = `
                    <h3>${book.name}</h3>
                    <div class="info">${book.chapters}章 · ${book.verses.toLocaleString()}节</div>
                    <div class="badge">${book.sections}单元</div>
                `;
                host.querySelector(`.book-grid[data-category="${book.category}"]`).appendChild(card);
            });
        }
    </script>
</body>
</html>
