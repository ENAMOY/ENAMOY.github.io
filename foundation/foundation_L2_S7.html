<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主权与顺服 - 第7节 | 建立根基</title>
    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 15px 15px 0 0;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .breadcrumb {
            color: #888;

            margin-bottom: 10px;
        }

        .breadcrumb a {

            text-decoration: underline;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;

        }

        .section-title-box {
            display: inline-flex;

        .section-label {

        .application-section h3 {

        }

        .btn {

        @media (max-width: 768px) {

                padding: 10px;

            h1 {

        .toast {
            position: fixed;

            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
            }
            to {
                transform: translateX(0);
            }
        }

        /* === 译本选择条 === */
        .translation-bar {
            background: white;
            padding: 12px 30px;
            display: flex;
            align-items: center;

        }
        .translation-bar .tl-label { font-size: 0.9em; color: #888; margin-right: 4px; }
        .translation-bar button {
            padding: 6px 16px; border: 2px solid #e0e0e0; border-radius: 20px;
            background: white; cursor: pointer; font-size: 0.85em; color: #666; transition: all 0.2s;
        }
        .translation-bar button:hover { border-color: #667eea; color: #667eea; }
        .translation-bar button.active {
            background: #667eea; color: white; border-color: #667eea;
        }
        /* === 经文弹窗 === */
        .verse-modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;
        }
        .verse-modal-overlay.show { display: flex; }
        .verse-modal {
            background: white; border-radius: 15px; padding: 30px; max-width: 600px;
            width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .verse-modal h3 { color: #667eea; margin-bottom: 4px; }
        .verse-modal .vm-ref { color: #888; font-size: 0.9em; margin-bottom: 16px; }
        .verse-modal .vm-text { line-height: 2; color: #333; font-size: 1.05em; }
        .verse-modal .vm-trans { color: #888; font-size: 0.85em; margin-top: 12px; text-align: right; }
        .verse-modal .btn-close { margin-top: 16px; padding: 8px 24px; background: #667eea;
            color: white; border: none; border-radius: 8px; cursor: pointer; float: right; }
        .btn-verse { padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px;
            background: #f8f9fa; cursor: pointer; font-size: 0.8em; margin-left: 4px; }
        .btn-verse:hover { background: #667eea; color: white; border-color: #667eea; }

    </style>
</head>
<body>

        <div class="action-bar">
            <div class="score-display">
                完成度: <span class="score-number" id="scoreDisplay">0%</span>
            </div>
            <div>
                <button class="btn btn-secondary" onclick="saveProgress()">💾 保存进度</button>
                <button class="btn btn-primary" onclick="submitAnswers()">✓ 提交答案</button>

    <div class="toast" id="toast"></div>

    <script>
        // 加载保存的进度
        window.addEventListener('load', () => {
            loadProgress();
            updateScore();
        });

        // 自动保存
        document.querySelectorAll('.answer-input, .application-input').forEach(input => {
            input.addEventListener('change', () => {
                updateScore();
            });
        });

        function loadProgress() {
            const key = 'foundation_L2_S7';
            const saved = localStorage.getItem(key);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    // 恢复答案
                    document.querySelectorAll('.answer-input').forEach(input => {
                        const q = input.dataset.question;
                        const ref = input.dataset.reference || 'main';
                        const savedAnswer = data.answers?.[`q${q}_${ref}`];
                        if (savedAnswer) {
                            input.value = savedAnswer;
                        }
                    });
                    // 恢复个人应用
                    const appInput = document.querySelector('.application-input');
                    if (appInput && data.application) {
                        appInput.value = data.application;
                    }
                } catch (e) {
                    console.error('加载进度失败:', e);
                }
            }
        }

        function saveProgress() {
            const key = 'foundation_L2_S7';
            const data = {
                answers: {},
                application: '',
                timestamp: new Date().toISOString()
            };
            
            // 保存所有答案
            document.querySelectorAll('.answer-input').forEach(input => {
                const q = input.dataset.question;
                const ref = input.dataset.reference || 'main';
                data.answers[`q${q}_${ref}`] = input.value;
            });
            
            // 保存个人应用
            const appInput = document.querySelector('.application-input');
            if (appInput) {
                data.application = appInput.value;
            }
            
            localStorage.setItem(key, JSON.stringify(data));
            showToast('✓ 进度已保存');
        }

        function submitAnswers() {
            saveProgress();
            updateScore();
            showToast('✓ 答案已提交！继续下一节吧');
        }

        function updateScore() {
            let totalFields = 0;
            let filledFields = 0;
            
            // 统计答案输入框
            document.querySelectorAll('.answer-input').forEach(input => {
                totalFields++;
                if (input.value.trim()) {
                    filledFields++;
                }
            });
            
            // 统计个人应用
            const appInput = document.querySelector('.application-input');
            if (appInput) {
                totalFields++;
                if (appInput.value.trim()) {
                    filledFields++;
                }
            }
            
            const percentage = totalFields > 0 ? Math.round((filledFields / totalFields) * 100) : 0;
            document.getElementById('scoreDisplay').textContent = percentage + '%';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }        // ====== 多译本支持 ======
        const TRANS_NAMES = { cuv: '和合本', ccb: '当代译本', csb: '标准译本', esv: 'ESV' };
        const VERSE_DATA = {"徒 9:35": {"text": "凡住吕大和沙仑的人都看见了他，就归服主。","ccb": "凡住吕大和沙仑的人都看见了他，就归服主。","csb": "","esv": "All those who lived in Lydda and Sharon saw him and turned to the Lord.","has_data": true,"has_ccb": true,"has_csb": false,"has_esv": true},"约 6:47": {"text": "我实实在在地告诉你们：信的人有永生。","ccb": "我实实在在地告诉你们，信的人有永生。","csb": "","esv": "Very truly I tell you, the one who believes has eternal life.","has_data": true,"has_ccb": true,"has_csb": false,"has_esv": true},"徒 11:21": {"text": "主的手与他们同在，信而归主的人数就很多。","ccb": "主与他们同在，信而归主的人就很多了。","csb": "","esv": "The Lord's hand was with them, and a great number of people believed and turned to the Lord.","has_data": true,"has_ccb": true,"has_csb": false,"has_esv": true},"雅 2:26": {"text": "身体没有灵魂是死的，信心没有行为也是死的。","ccb": "身体没有灵魂是死的，信心没有行为也是死的。","csb": "","esv": "As the body without the spirit is dead, so faith without deeds is dead.","has_data": true,"has_ccb": true,"has_csb": false,"has_esv": true},"徒 26:18": {"text": "我差你到他们那里去，要叫他们的眼睛得开，从黑暗中归向光明，从撒但权下归向神；又因信我，得蒙赦罪，和一切成圣的人同得基业。","ccb": "我差你到他们那里去，要叫他们的眼睛得开，从黑暗中归向光明，从撒但权下归向　神；又因信我，得蒙赦罪，和一切成圣的人同得基业。’”","csb": "","esv": "to open their eyes, that they may turn from darkness to light and from the power of Satan to God, that they may receive remission of sins and an inheritance among those who are sanctified by faith in me.’","has_data": true,"has_ccb": true,"has_csb": false,"has_esv": true}};
        let currentTranslation = localStorage.getItem('foundation_translation') || 'cuv';

        function getVerseText(ref, trans) {
            const entry = VERSE_DATA[ref];
            if (!entry) return null;
            if (trans === 'cuv') return entry.text || null;
            if (entry['has_' + trans] && entry[trans] && entry[trans].trim()) return entry[trans];
            return entry.text || null;
        }

        function setTranslation(trans) {
            currentTranslation = trans;
            localStorage.setItem('foundation_translation', trans);
            document.querySelectorAll('.tl-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.trans === trans);
            });
        }

        function showVerseDisplay(ref) {
            const text = getVerseText(ref, currentTranslation);
            if (!text) { alert('暂无经文数据'); return; }
            document.getElementById('vmTitle').textContent = '📖 ' + ref;
            document.getElementById('vmRef').textContent = TRANS_NAMES[currentTranslation] || currentTranslation;
            document.getElementById('vmText').textContent = text;
            document.getElementById('vmTrans').textContent = '— ' + (TRANS_NAMES[currentTranslation] || currentTranslation);
            document.getElementById('verseModal').classList.add('show');
        }

        // Init after DOM ready
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.tl-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.trans === currentTranslation);
            });
            const modal = document.getElementById('verseModal');
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) this.classList.remove('show');
                });
            }
        });
    </script>

    <div class="verse-modal-overlay" id="verseModal">
        <div class="verse-modal">
            <h3 id="vmTitle"></h3>
            <div class="vm-ref" id="vmRef"></div>
            <div class="vm-text" id="vmText"></div>
            <div class="vm-trans" id="vmTrans"></div>
            <button class="btn-close" onclick="document.getElementById('verseModal').classList.remove('show')">关闭</button>
        </div>
    </div>

</body>
